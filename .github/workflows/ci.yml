name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash scripts/setup.sh
      - run: pnpm test
      - run: pnpm build:core && pnpm check:package
      - run: npm --prefix apps/website run build
      - run: npm --prefix apps/website audit --audit-level=high
  browser-hardware:
    # Opt-in hardware runner. CI software adapters must never masquerade as real-GPU evidence.
    if: ${{ vars.TINYSARF_HARDWARE_RUNNER == 'enabled' }}
    runs-on: [self-hosted, tinysarf-webgpu]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/setup.sh
      - run: pnpm build:core
      - run: pnpm benchmark:browser --smoke --local
      - uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: packages/benchmark/local/*.json
